schema_version: microvae-config-v1
experiment:
  name: smoke_synthetic
  route: hq_codec
  output_dir: runs/smoke_synthetic
  seed: 0
  allow_existing_output: true
data:
  mode: synthetic
  synthetic_n_groups: 4
  synthetic_pages_per_group: 2
  synthetic_size: 64
normalization:
  method: identity
  fit_split: train
  clip: false
crop:
  size: 64
model:
  in_channels: 1
  out_channels: 1
  latent_channels: 4
  encoder_block_out_channels: [32, 64, 64]
  decoder_block_out_channels: [32, 64, 64]
  layers_per_block: 1
  norm_num_groups: 8
  mid_block_add_attention: false
  output_activation: linear
initialization:
  mode: fresh_init
task:
  name: hq_codec
loss:
  w_char: 1.0
  w_ms_ssim: 0.0
  w_grad: 0.0
  w_flux: 0.0
  free_nats: 0.0
  ms_ssim_start_step: 100000
kl_schedule:
  t0: 0
  t1: 1
  beta_max: 0.0001
optimizer:
  lr: 0.001
training:
  max_steps: 4
  microbatch_size: 2
  grad_accum: 1
  log_every_steps: 1
  val_every_steps: 2
  overfit_n_patches: 4
  num_workers: 0
  ema_decay: null
scheduler:
  warmup_steps: 0
  min_lr: 0.000001
precision:
  amp_dtype: fp32
evaluation:
  allow_test: false
checkpoint:
  save_every_steps: 100
  keep_last: 3
