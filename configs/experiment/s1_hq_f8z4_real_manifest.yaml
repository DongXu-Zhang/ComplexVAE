# S1 HQ codec against data_fix/hq_manifest_v2.jsonl
# Paths in JSONL are F:\Dataset\... — set path_prefix_target after mount/copy.
schema_version: microvae-config-v1
experiment:
  name: s1_hq_f8z4_real_manifest
  route: hq_codec
  output_dir: runs/s1_hq_f8z4_real
  seed: 0
  notes: "Uses frozen hq_manifest_v2; test rows refused by loader"
data:
  mode: hq_pool
  # Override on the training host, e.g.:
  #   --override data.manifest_path=/data/inventory/hq_manifest_v2.jsonl
  #   --override data.path_prefix_target=/data/Dataset
  #   --override data.path_require_exists=true
  manifest_path: null
  allow_splits: [train, val]
  path_prefix_source: "F:\\Dataset"
  path_prefix_target: null
  path_require_exists: false
normalization:
  method: robust_linear_p0.1_p99.9
  fit_split: train
  clip: false
crop:
  size: 256
model:
  in_channels: 1
  out_channels: 1
  latent_channels: 4
  encoder_block_out_channels: [128, 256, 512, 512]
  decoder_block_out_channels: [96, 192, 384, 384]
  layers_per_block: 2
  norm_num_groups: 32
  mid_block_add_attention: true
  output_activation: linear
initialization:
  mode: fresh_init
task:
  name: hq_codec
  sample_posterior: true
loss:
  w_char: 1.0
  w_ms_ssim: 0.1
  w_grad: 0.05
  w_flux: 0.01
  free_nats: 0.5
  ms_ssim_start_step: 1000
kl_schedule:
  t0: 2000
  t1: 20000
  beta_max: 0.01
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001
scheduler:
  name: cosine
  warmup_steps: 500
  min_lr: 0.000001
precision:
  amp_dtype: bf16
memory:
  gradient_checkpointing: true
training:
  max_steps: 100000
  microbatch_size: 4
  grad_accum: 2
  grad_clip_norm: 1.0
  ema_decay: 0.999
  val_every_steps: 1000
  log_every_steps: 50
  candidate_steps: [20000, 40000, 60000, 80000, 100000]
  overfit_n_patches: 16
  num_workers: 4
evaluation:
  allow_test: false
checkpoint:
  save_every_steps: 2000
  keep_last: 3
logging:
  level: INFO
