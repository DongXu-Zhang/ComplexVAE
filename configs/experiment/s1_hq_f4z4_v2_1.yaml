# S1 v2.1 — same f4 architecture as v2, but v1 loss family.
#
# Why: v1 (f8/z4, 100k) did not produce dark-background speckle.
# v2 added amp_norm, unbounded edge weights, and HF loss. Those terms
# over-fit isolated noise on any low-contrast patch (black, grey, or dim).
# Stacking more losses (dark-FP etc.) cannot cover every dark shade.
# Revert the new loss extras; keep f4 + bilinear + sampling.
schema_version: microvae-config-v1
experiment:
  name: s1_hq_f4z4_v2_1
  route: hq_codec
  output_dir: runs/s1_hq_f4z4_v2_1
  seed: 0
  notes: "v2.1: f4/bilinear/coverage, but v1 losses (no amp_norm, no edge weight, no HF)"
  allow_existing_output: false
data:
  mode: hq_pool
  manifest_path: null
  allow_splits: [train, val]
  path_prefix_source: "F:\\Dataset"
  path_prefix_target: null
  path_require_exists: false
normalization:
  method: robust_linear_p0.1_p99.9
  fit_split: train
  clip: false
  ssim_data_range: 1.0
  fit_mode: source_balanced
  max_pages_fit: 192
  max_pixels_per_page: 65536
sampling:
  strategy: source_group_page
  source_weight_mode: sqrt_groups
  slice_weight_mode: focus_softmax
  focus_sidecar_path: null
  focus_temperature: 0.7
  focus_min_keep: 0.15
  focus_compute_if_missing: true
crop:
  size: 256
  mode: coverage_jitter
  coverage_jitter_frac: 0.25
  min_robust_range: 0.0
  max_range_retries: 1
model:
  in_channels: 1
  out_channels: 1
  latent_channels: 4
  encoder_block_out_channels: [128, 256, 512]
  decoder_block_out_channels: [96, 192, 384]
  layers_per_block: 2
  norm_num_groups: 32
  mid_block_add_attention: true
  output_activation: linear
  upsample_mode: bilinear
  downsample_pad_mode: symmetric
  downsample_preblur: true
initialization:
  mode: fresh_init
task:
  name: hq_codec
  sample_posterior: true
loss:
  w_char: 1.0
  w_ms_ssim: 0.1
  w_grad: 0.05
  w_flux: 0.01
  w_hf: 0.0
  w_dark_fp: 0.0
  free_nats: 0.5
  ms_ssim_start_step: 1000
  ms_ssim_ramp_steps: 500
  amp_norm: false
  edge_weight: 0.0
  edge_weight_clip: 0.0
  ssim_range_mode: fixed
kl_schedule:
  t0: 2000
  t1: 20000
  beta_max: 0.01
optimizer:
  name: adamw
  lr: 0.00008
  weight_decay: 0.0001
scheduler:
  name: cosine
  warmup_steps: 1000
  min_lr: 0.000001
precision:
  amp_dtype: bf16
memory:
  gradient_checkpointing: true
training:
  max_steps: 150000
  microbatch_size: 4
  grad_accum: 2
  grad_clip_norm: 1.0
  ema_decay: 0.999
  val_every_steps: 1000
  log_every_steps: 50
  candidate_steps: [30000, 60000, 90000, 120000, 150000]
  overfit_n_patches: 16
  num_workers: 4
evaluation:
  allow_test: false
  use_ema_for_val: true
  use_posterior_mean: true
  extended_metrics: true
checkpoint:
  save_every_steps: 2000
  keep_last: 3
  keep_best_snr: true
  keep_best_mae: true
logging:
  level: INFO
